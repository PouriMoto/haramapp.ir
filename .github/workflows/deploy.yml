# استقرار روی GitHub Pages. هیچ متغیر یا رازی لازم نیست؛ همهٔ تنظیمات در data/site.json است.
# یک‌بار: Settings → Pages → Source: GitHub Actions
name: Deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: آدرس Apps Script در data/site.json پر شده؟
        run: |
          node -e "const s=require('./data/site.json'); if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(s.appsScriptUrl||'')){console.error('::error::data/site.json → appsScriptUrl خالی یا نادرست است (باید با https://script.google.com/ شروع و به /exec ختم شود)');process.exit(1)}"
      - run: npm run lint
      - run: npm test
      - run: npm run build   # محتوای data/ را هم می‌سازد؛ مسیر پایه (base) و CNAME خودکار از data/site.json (vite.config.ts → resolveBase)
      - name: گارد مسیر assetها (جلوی صفحهٔ سفید)
        run: |
          node -e "
          const fs=require('fs');
          const d=(require('./data/site.json').domain||'').trim();
          const html=fs.readFileSync('dist/index.html','utf8');
          const m=[...html.matchAll(/(?:src|href)=\"([^\"]*\\/assets\\/[^\"]+)\"/g)].map(x=>x[1]);
          if(!m.length){console.error('::error::هیچ asset در dist/index.html پیدا نشد');process.exit(1)}
          const bad=d?m.filter(u=>!u.startsWith('/assets/')):m.filter(u=>u.startsWith('/assets/'));
          if(bad.length){console.error('::error::مسیر assetها با تنظیم domain سازگار نیست: '+bad[0]);process.exit(1)}
          if(d&&!fs.existsSync('dist/CNAME')){console.error('::error::domain پر است ولی dist/CNAME ساخته نشده');process.exit(1)}
          console.log('OK',m.length,'asset، domain=',d||'(خالی)')"
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
